name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ALIYUN_USERNAME  # 指定使用 Environment 配置
    steps:
    - uses: actions/checkout@v3

    - name: Login to Alibaba Cloud Registry
      run: echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login -u ${{ secrets.ALIYUN_USERNAME }} --password-stdin registry.cn-hangzhou.aliyuncs.com

    - name: Install crane for OCI artifacts
      run: |
        CRANE_VERSION="0.19.2"
        curl -fsSL "https://github.com/google/crane/releases/download/v${CRANE_VERSION}/crane_${CRANE_VERSION}_linux_amd64.tar.gz" | tar -xzf - -C /usr/local/bin crane
        crane version

    - name: Pull and Push Images
      run: |
        # 读取 images.txt 中的镜像列表，格式: 源镜像名=目标镜像名(可选)
        # 示例:
        # labring/kubernetes-docker:v1.29.5-arm64
        # nginx:latest=my-nginx:latest
        # ghcr.io/falcosecurity/rules/falco-rules:5=falco-rules:5   <- OCI artifact
        while IFS= read -r line || [[ -n "$line" ]]; do
          # 跳过空行和注释行
          [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

          # 解析源镜像和目标镜像
          if [[ "$line" == *"="* ]]; then
            source_image="${line%%=*}"
            target_image="${line#*=}"
          else
            source_image="$line"
            target_image="$line"
          fi

          # 去除前后空格和 Windows 行尾 \r
          source_image=$(echo "$source_image" | xargs | tr -d '\r')
          target_image=$(echo "$target_image" | xargs | tr -d '\r')

          # 提取镜像名（去掉命名空间前缀）
          # 例如: labring/kubernetes-docker:v1.29.5-arm64 → kubernetes-docker:v1.29.5-arm64
          if [[ "$target_image" == *"/"* ]]; then
            target_image="${target_image##*/}"
          fi

          echo "========================================"
          echo "正在处理镜像: $source_image"
          echo "目标镜像: registry.cn-hangzhou.aliyuncs.com/zhangjinhui/$target_image"
          echo "========================================"

          # 判断是否使用 crane（ghcr.io 上的 OCI artifact）
          if [[ "$source_image" == ghcr.io/* ]]; then
            echo "[crane] Pulling OCI artifact: $source_image"
            crane pull "$source_image" /tmp/artifact.tar
            echo "[crane] Pushing OCI artifact to aliyun..."
            crane push /tmp/artifact.tar "registry.cn-hangzhou.aliyuncs.com/zhangjinhui/$target_image"
          else
            # 普通 Docker 镜像
            docker pull "$source_image"
            docker tag "$source_image" "registry.cn-hangzhou.aliyuncs.com/zhangjinhui/$target_image"
            docker push "registry.cn-hangzhou.aliyuncs.com/zhangjinhui/$target_image"
          fi

          echo "镜像 $source_image 处理完成"
          echo ""
        done < images.txt
